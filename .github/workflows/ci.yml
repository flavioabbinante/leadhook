name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci
          LEADHOOK_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          LEADHOOK_ENV_FILE: /dev/null
      - run: uv run pytest

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadhook
          POSTGRES_PASSWORD: leadhook
          POSTGRES_DB: leadhook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadhook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEADHOOK_TEST_DATABASE_URL: postgres://leadhook:leadhook@localhost:5432/leadhook
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leadhook:ci .
