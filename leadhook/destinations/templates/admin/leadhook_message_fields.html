<div class="lh-insert">
  <div class="lh-insert-row">
    <span class="lh-insert-label">Modulo</span>
    {% if forms %}
      <select class="lh-insert-form" aria-label="Modulo di cui inserire le domande">
        {% for form in forms %}<option value="{{ form.pk }}">{{ form.name|default:form.form_id }}</option>{% endfor %}
      </select>
    {% else %}
      <span class="lh-flow-detail">Nessuna domanda di un modulo per ora: collega una pagina nella configurazione.</span>
    {% endif %}
  </div>
  {% for form in forms %}
    <div class="lh-chips" data-form="{{ form.pk }}"{% if not forloop.first %} hidden{% endif %}>
      {% for question in form.questions %}<button type="button" class="lh-chip" data-insert="{{ '{' }}{{ question.key }}{{ '}' }}" title="{{ '{' }}{{ question.key }}{{ '}' }}">{{ question.label }}</button>{% endfor %}
    </div>
  {% endfor %}
  <div class="lh-insert-row">
    <span class="lh-insert-label">Meta</span>
    <div class="lh-chips">
      {% for name, label in details %}<button type="button" class="lh-chip" data-insert="{{ '{' }}{{ name }}{{ '}' }}" title="{{ '{' }}{{ name }}{{ '}' }}">{{ label }}</button>{% endfor %}
    </div>
  </div>
</div>
