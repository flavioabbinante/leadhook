{% extends "admin/leadhook_card.html" %}
{% block content %}
<div id="content-main">
  <p>Inserisci l'email del tuo account: ti mandiamo un link per scegliere una nuova password.</p>
  <form method="post">{% csrf_token %}
    <div class="form-row">
      {{ form.email.errors }}
      <label for="id_email">Email:</label> {{ form.email }}
    </div>
    <div class="submit-row"><input type="submit" value="Invia il link"></div>
  </form>
  <p class="lh-auth-footer"><a href="{% url 'admin:login' %}">Torna all'accesso</a></p>
</div>
{% endblock %}
