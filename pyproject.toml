[project]
name = "leadhook"
version = "0.1.0"
description = "Self-hosted router from Facebook Lead Ads to webhooks"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "django>=5.2,<6.0",
    "celery[redis]>=5.4,<6.0",
    "django-environ>=0.11",
    "cryptography>=43,<51",
    "requests>=2.32",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "whitenoise>=6.7",
    "segno>=1.6.6",
]

[project.optional-dependencies]
# Timestral forecasts the expected lead volume for check_lead_drop; without it the plain average is used.
forecast = ["timestral", "torch>=2.4"]

[dependency-groups]
dev = [
    "numpy>=1.24",  # Timestral tests run with a fake model, without torch
    "pytest>=8",
    "pytest-django>=4.9",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.uv.sources]
timestral = { url = "https://github.com/mistralai/timestral/archive/a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff.tar.gz" }
torch = { index = "pytorch-cpu" }  # CPU-only wheels: CUDA would add gigabytes

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore:The default scheme will be changed from 'http' to 'https' in Django 6.0:django.utils.deprecation.RemovedInDjango60Warning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
